# Watchdog hardware gestito da systemd: se kernel o PID 1 si bloccano per 15s
# il BCM2835 resetta il Pi. Indipendente da watchdog.service (che resta disabilitato).
# Installazione:
#   sudo install -D -m 644 systemd-runtime-watchdog.conf /etc/systemd/system.conf.d/watchdog.conf
#   sudo systemctl daemon-reexec
[Manager]
RuntimeWatchdogSec=15s
